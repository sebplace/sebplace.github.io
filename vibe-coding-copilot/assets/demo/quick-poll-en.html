<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Poll — live demo</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --muted:#9198a1;
    --purple:#a371f7; --blue:#58a6ff; --green:#3fb950;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Arial,sans-serif;}
  .poll-card{max-width:560px;margin:0 auto;padding:22px 24px 26px;}
  .poll-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--purple);background:rgba(163,113,247,.12);
    border:1px solid rgba(163,113,247,.35);padding:4px 10px;border-radius:999px;margin-bottom:12px;}
  h2{font-size:19px;margin:0 0 16px;line-height:1.35;}
  .options{display:flex;flex-direction:column;gap:8px;}
  .options button{
    text-align:left;background:var(--card);border:1px solid var(--border);color:var(--text);
    padding:12px 14px;border-radius:9px;font-size:14.5px;cursor:pointer;transition:.15s;
  }
  .options button:hover{border-color:var(--purple);background:#1c2128;}
  .results{display:flex;flex-direction:column;gap:12px;}
  .result-row{display:grid;grid-template-columns:1fr 3fr auto;align-items:center;gap:10px;font-size:13.5px;}
  .result-label{color:var(--text);}
  .bar-track{background:#21262d;border-radius:999px;height:10px;overflow:hidden;}
  .bar-fill{background:linear-gradient(90deg,var(--purple),var(--blue));height:100%;width:0%;
    border-radius:999px;transition:width .6s ease;}
  .result-pct{color:var(--muted);font-variant-numeric:tabular-nums;width:38px;text-align:right;}
  .poll-note{margin-top:14px;font-size:12.5px;color:var(--muted);}
  .poll-note button{background:none;border:none;color:var(--blue);cursor:pointer;
    font-size:12.5px;text-decoration:underline;padding:0;}
  .voted-tag{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-size:12.5px;
    font-weight:600;margin-bottom:10px;}
</style>
</head>
<body>
<div class="poll-card">
  <span class="poll-badge">Quick Poll — live demo</span>
  <h2 id="question">What would help you most this term?</h2>

  <div class="options" id="options">
    <button data-i="0">Worked examples</button>
    <button data-i="1">More hands-on exercises</button>
    <button data-i="2">Short videos</button>
    <button data-i="3">Live Q&amp;A sessions</button>
  </div>

  <div class="results" id="results" hidden>
    <div class="voted-tag">✓ Thanks, your vote was counted!</div>
    <div class="result-row"><span class="result-label">Worked examples</span><div class="bar-track"><div class="bar-fill" id="bar0"></div></div><span class="result-pct" id="pct0">0%</span></div>
    <div class="result-row"><span class="result-label">More hands-on exercises</span><div class="bar-track"><div class="bar-fill" id="bar1"></div></div><span class="result-pct" id="pct1">0%</span></div>
    <div class="result-row"><span class="result-label">Short videos</span><div class="bar-track"><div class="bar-fill" id="bar2"></div></div><span class="result-pct" id="pct2">0%</span></div>
    <div class="result-row"><span class="result-label">Live Q&amp;A sessions</span><div class="bar-track"><div class="bar-fill" id="bar3"></div></div><span class="result-pct" id="pct3">0%</span></div>
    <p class="poll-note">Results are stored locally in your browser, for this demo only. <button id="reset">↻ Vote again</button></p>
  </div>
</div>

<script>
  var KEY = "vibecoding_quickpoll_en_v1";
  var optionsEl = document.getElementById("options");
  var resultsEl = document.getElementById("results");

  function getVotes() {
    try { return JSON.parse(localStorage.getItem(KEY)) || [0,0,0,0]; }
    catch (e) { return [0,0,0,0]; }
  }
  function saveVotes(v) { localStorage.setItem(KEY, JSON.stringify(v)); }

  function renderResults() {
    var votes = getVotes();
    var total = votes.reduce(function(a,b){ return a+b; }, 0) || 1;
    for (var i = 0; i < 4; i++) {
      var pct = Math.round((votes[i] / total) * 100);
      document.getElementById("bar" + i).style.width = pct + "%";
      document.getElementById("pct" + i).textContent = pct + "%";
    }
  }

  var already = localStorage.getItem(KEY + "_done");
  if (already) {
    optionsEl.hidden = true;
    resultsEl.hidden = false;
    renderResults();
  }

  optionsEl.querySelectorAll("button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var i = parseInt(btn.getAttribute("data-i"), 10);
      var votes = getVotes();
      votes[i] += 1;
      saveVotes(votes);
      localStorage.setItem(KEY + "_done", "1");
      optionsEl.hidden = true;
      resultsEl.hidden = false;
      renderResults();
    });
  });

  document.getElementById("reset").addEventListener("click", function () {
    localStorage.removeItem(KEY);
    localStorage.removeItem(KEY + "_done");
    resultsEl.hidden = true;
    optionsEl.hidden = false;
  });
</script>
</body>
</html>
